[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Chat + Research agents for asking questions about a dataset, backed by LangGraph and Groq."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "tenacity>=9.0",
    "slowapi>=0.1.9",
    "streamlit>=1.39",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` as a default argument is the framework's
# intended pattern, not the footgun this rule targets.
# N999: Streamlit's `pages/1_Chat.py`-style filenames aren't valid module names.
ignore = ["B008", "N999"]
